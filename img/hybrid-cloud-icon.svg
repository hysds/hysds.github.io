<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Hybrid Cloud -->
  <path d="M25,60 a20,20 0 0,1 0,-40 a30,30 0 0,1 50,0 a20,20 0 0,1 0,40 Z" fill="#1E88E5" opacity="0.9"/>
  <path d="M35,70 a15,15 0 0,1 0,-30 a25,25 0 0,1 40,0 a15,15 0 0,1 0,30 Z" fill="#1E88E5" opacity="0.6" transform="translate(-10, -20)"/>
  <circle cx="50" cy="50" r="35" fill="none" stroke="#1E88E5" stroke-width="2" stroke-dasharray="4,4">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 50 50"
      to="360 50 50"
      dur="10s"
      repeatCount="indefinite"/>
  </circle>
</svg>
